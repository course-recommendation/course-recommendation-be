name: Build Application

on:
  workflow_call:

jobs:
  build-backend:
    runs-on: ubuntu-22.04
    name: Build Backend App
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Java environment
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
      - name: Build with Gradle
        run: ./gradlew build -x test

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Azure CLI Login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_TERRAFORM }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set ACR name
        shell: bash
        run: |
            echo "ACR_NAME=acrcourserecom" >> $GITHUB_ENV
      - name: Log in to Azure Container Registry
        shell: bash
        run: |
          az acr login --name ${{ env.ACR_NAME }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: |
            JAR_FILE=build/libs/*.jar
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/backend:latest
          cache-from: type=registry,ref=${{ env.ACR_NAME }}.azurecr.io/backend:latest
          cache-to: type=inline

      - name: Clean up untagged images
        shell: bash
        run: |
          # Delete untagged (dangling) manifests
          az acr manifest list-metadata --name backend --registry ${{ env.ACR_NAME }} \
            --query "[?tags[0]==null].digest" -o tsv \
            | xargs -I% az acr repository delete --name ${{ env.ACR_NAME }} --image backend@% --yes
